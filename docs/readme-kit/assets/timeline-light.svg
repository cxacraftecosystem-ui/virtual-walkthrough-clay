<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="244" viewBox="0 0 1200 244" role="img" aria-label="The pavilion so far: forked from the hand block museum on 31 October, raised into a domed rotunda on 1 November, every room and the landing page finished on 2 November, the workshop's confirmation next">
<title>The pavilion so far: forked from the hand block museum on 31 October, raised into a domed rotunda on 1 November, every room and the landing page finished on 2 November, the workshop's confirmation next</title>
<defs>
<style>.d{font-family:'Plus Jakarta Sans','Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.s{font-family:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace}.rise{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.prog{stroke-dasharray:816.7;stroke-dashoffset:0;animation:prog 2.4s cubic-bezier(.4,0,.2,1) .2s both}@keyframes prog{from{stroke-dashoffset:816.7}to{stroke-dashoffset:0}}.halo{animation:halo 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}@keyframes halo{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.8);opacity:0}}.ahead{stroke-dasharray:2 10}.r0{animation-delay:0.1s}.r1{animation-delay:0.3s}.r2{animation-delay:0.4s}.r3{animation-delay:0.6s}.r4{animation-delay:0.7s}.r5{animation-delay:0.9s}.r6{animation-delay:1.1s}@media (prefers-reduced-motion:reduce){*{animation:none!important}.smil{display:none}.sweep{fill:url(#still)}}</style>
<linearGradient id="pg" gradientUnits="userSpaceOnUse" x1="110" y1="0" x2="926.7" y2="0"><stop offset="0" stop-color="#762CB1"/><stop offset="1" stop-color="#AA69E9"/></linearGradient>
</defs>
<path class="ahead" d="M70 112 H1130" stroke="#DCD7EE" stroke-width="3" stroke-linecap="round" fill="none"/>
<path class="prog" d="M110 112 H926.7" stroke="url(#pg)" stroke-width="4" stroke-linecap="round" fill="none"/>
